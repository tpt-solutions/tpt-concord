[package]
name = "tpt-concord-derive"
description = "#[derive(SpecState)]: map a Rust struct onto specification state and generate a specification skeleton"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["derive", "specification", "conformance", "verification", "proc-macro"]
categories = ["development-tools", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
# Enables the `derive` feature of tpt-concord-spec for the tests below.
tpt-concord-spec = { workspace = true, features = ["derive"] }
