[package]
name = "tpt-concord-cli"
description = "Concord command line: spec, model, check, prove, simulate, fuzz, diff, evidence, gate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["cli", "verification", "conformance", "assurance", "release-gate"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "concord"
path = "src/main.rs"

[dependencies]
tpt-concord-core = { workspace = true, features = ["schema"] }
tpt-concord-spec = { workspace = true, features = ["schema"] }
tpt-concord-model = { workspace = true, features = ["schema"] }
tpt-concord-trace = { workspace = true, features = ["schema"] }
tpt-concord-check = { workspace = true }
tpt-concord-property = { workspace = true }
tpt-concord-fuzz = { workspace = true }
tpt-concord-diff = { workspace = true }
tpt-concord-proof = { workspace = true }
tpt-concord-sim = { workspace = true }
tpt-concord-evidence = { workspace = true, features = ["schema"] }
tpt-concord-release = { workspace = true, features = ["schema"] }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
schemars = { workspace = true }

[dev-dependencies]
jsonschema = "0.33.0"
