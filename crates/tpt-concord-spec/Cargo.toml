[package]
name = "tpt-concord-spec"
description = "Specification representation: pre/postconditions, invariants, transitions, effects, bounds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["specification", "invariants", "contracts", "verification", "formal-methods"]
categories = ["development-tools", "development-tools::testing"]

[features]
schema = ["dep:schemars"]
derive = ["dep:tpt-concord-derive"]

[dependencies]
schemars = { workspace = true, optional = true }
tpt-concord-core = { workspace = true }
tpt-concord-derive = { workspace = true, optional = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
