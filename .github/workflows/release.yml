name: Release binaries

# Tag `vX.Y.Z` to build `concord` for Linux, macOS and Windows and attach the
# archives to a GitHub release. Publishing to crates.io stays a manual step:
#   cargo publish --workspace

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p tpt-concord-cli --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        run: |
          name=concord-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/concord LICENSE-MIT LICENSE-APACHE README.md "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $name = "concord-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/concord.exe, LICENSE-MIT, LICENSE-APACHE, README.md $name
          Compress-Archive $name "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            concord-*.tar.gz
            concord-*.zip
            concord-*.sha256
