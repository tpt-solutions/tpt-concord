[workspace]
resolver = "2"
members = [
    "crates/tpt-concord-core",
    "crates/tpt-concord-spec",
    "crates/tpt-concord-model",
    "crates/tpt-concord-trace",
    "crates/tpt-concord-check",
    "crates/tpt-concord-property",
    "crates/tpt-concord-fuzz",
    "crates/tpt-concord-diff",
    "crates/tpt-concord-proof",
    "crates/tpt-concord-sim",
    "crates/tpt-concord-contract",
    "crates/tpt-concord-evidence",
    "crates/tpt-concord-release",
    "crates/tpt-concord-cli",
    "crates/tpt-concord-pilot-archon-wal",
    "crates/tpt-concord-assurance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-concord"
homepage = "https://github.com/tpt-solutions/tpt-concord"

[workspace.dependencies]
# Internal crates
tpt-concord-core = { path = "crates/tpt-concord-core", version = "0.1.0" }
tpt-concord-spec = { path = "crates/tpt-concord-spec", version = "0.1.0" }
tpt-concord-model = { path = "crates/tpt-concord-model", version = "0.1.0" }
tpt-concord-trace = { path = "crates/tpt-concord-trace", version = "0.1.0" }
tpt-concord-check = { path = "crates/tpt-concord-check", version = "0.1.0" }
tpt-concord-property = { path = "crates/tpt-concord-property", version = "0.1.0" }
tpt-concord-fuzz = { path = "crates/tpt-concord-fuzz", version = "0.1.0" }
tpt-concord-diff = { path = "crates/tpt-concord-diff", version = "0.1.0" }
tpt-concord-proof = { path = "crates/tpt-concord-proof", version = "0.1.0" }
tpt-concord-sim = { path = "crates/tpt-concord-sim", version = "0.1.0" }
tpt-concord-contract = { path = "crates/tpt-concord-contract", version = "0.1.0" }
tpt-concord-evidence = { path = "crates/tpt-concord-evidence", version = "0.1.0" }
tpt-concord-release = { path = "crates/tpt-concord-release", version = "0.1.0" }

# External dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
schemars = { version = "1", default-features = false, features = ["derive", "std"] }

# The workspace ships a lockfile for reproducible evidence: CI and release
# builds must see the exact dependency graph recorded in evidence bundles.
